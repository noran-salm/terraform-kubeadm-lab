
name: Kubernetes Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'inventory.ini'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, bastion]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Ansible
        run: ansible --version

      - name: Validate Inventory
        run: ansible-inventory -i ansible/inventory.ini --list

      - name: Test Playbook Syntax
        run: ansible-playbook -i ansible/inventory.ini ansible/cluster.yml --syntax-check
