
name: Full Infrastructure Automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-kubernetes-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform + Ansible + Kubernetes
    runs-on: [self-hosted, linux, x64, bastion]
    timeout-minutes: 90

    env:
      AWS_REGION: eu-west-3
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 3. Check prerequisites
      - name: Check Runner Prerequisites
        shell: bash
        run: |
          set -euo pipefail

          command -v terraform
          command -v ansible-playbook
          command -v ssh
          command -v unzip

          terraform version
          ansible-playbook --version

          test -f "$HOME/.ssh/my-aws-key.pem"
          chmod 600 "$HOME/.ssh/my-aws-key.pem"

          RUNNER_PUBLIC_IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_PUBLIC_IP=${RUNNER_PUBLIC_IP}/32" >> "$GITHUB_ENV"

      # 4. AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Terraform checks
      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # 6. Terraform Plan
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="my_ip=${RUNNER_PUBLIC_IP}"

      # 7. Terraform Apply
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      # 8. Verify Bastion
      - name: Wait for Bastion SSH
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail

          BASTION_IP=$(terraform output -raw bastion_public_ip)

          for attempt in $(seq 1 30); do
            if ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=no \
              -i "$HOME/.ssh/my-aws-key.pem" \
              "ubuntu@$BASTION_IP" true; then
              echo "Bastion SSH is ready."
              exit 0
            fi

            echo "Waiting for Bastion: $attempt/30"
            sleep 10
          done

          echo "Bastion SSH connection failed."
          exit 1

      # 9. Validate inventory
      - name: Validate Ansible Inventory
        run: |
          set -euo pipefail

          test -s ansible/inventory.ini

          ansible-inventory \
            -i ansible/inventory.ini \
            --graph

      # 10. Wait for EC2 nodes
      - name: Wait for EC2 Connections
        run: |
          ansible k8s_cluster \
            -i ansible/inventory.ini \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=600"

      # 11. Prepare Kubernetes
      - name: Prepare Kubernetes Nodes
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/prepare-k8s.yml

      # 12. Initialize Control Plane
      - name: Initialize Kubernetes Control Plane
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/cluster.yml

      # 13. Deploy Calico and Join Worker
      - name: Deploy Kubernetes Cluster
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy-cluster.yml

      # 14. Final validation
      - name: Validate Kubernetes Cluster
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/verify-cluster.yml

      # 15. Display result
      - name: Final Infrastructure Summary
        if: success()
        working-directory: terraform
        run: |
          echo "Infrastructure deployment completed."
          terraform output
