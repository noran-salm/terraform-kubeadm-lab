name: Full Infrastructure Automation

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/kubernetes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-kubernetes-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_PAGER: ""
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/../.tf-plugin-cache
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_RETRY_FILES_ENABLED: "False"
  ANSIBLE_PIPELINING: "True"
  ANSIBLE_FORCE_COLOR: "True"
  ANSIBLE_TIMEOUT: "30"
  ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10"

jobs:
  deploy:
    name: Provision AWS and Deploy Kubernetes
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Runs BEFORE any aws call. Installs AWS CLI v2 (user-level, no sudo)
      # if missing; persists on the self-hosted runner for later runs.
      - name: Validate Runner Prerequisites
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          for cmd in ansible ansible-playbook ansible-inventory ssh ssh-keygen curl unzip python3; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "::error::Required command '$cmd' is not installed on the runner."
              exit 1
            }
          done

          if ! command -v aws >/dev/null 2>&1; then
            echo "AWS CLI not found. Installing AWS CLI v2..."
            tmp="$(mktemp -d)"
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$tmp/awscliv2.zip"
            unzip -q "$tmp/awscliv2.zip" -d "$tmp"
            "$tmp/aws/install" --update -i "$HOME/.local/aws-cli" -b "$HOME/.local/bin"
            rm -rf "$tmp"
          fi

          aws --version
          ansible-playbook --version | head -n 1

          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Prepare SSH Key and Runner IP
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          KEY_PATH="$HOME/.ssh/my-aws-key.pem"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Local runner key wins if present; otherwise use the GitHub secret.
          if [[ -s "$KEY_PATH" ]]; then
            echo "Using existing local SSH key."
            if [[ -n "${SSH_PRIVATE_KEY:-}" ]]; then
              echo "::warning::SSH_PRIVATE_KEY secret ignored because a local key exists."
            fi
          elif [[ -n "${SSH_PRIVATE_KEY:-}" ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_PATH"
            echo "SSH_KEY_CREATED_FROM_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "::error::No SSH key: set SSH_PRIVATE_KEY secret or place $KEY_PATH on the runner."
            exit 1
          fi

          chmod 600 "$KEY_PATH"
          ssh-keygen -y -f "$KEY_PATH" >/dev/null
          echo "SSH private key validated."

          RUNNER_PUBLIC_IP="$(
            curl -4 -fsS --max-time 10 https://checkip.amazonaws.com ||
            curl -4 -fsS --max-time 10 https://ifconfig.me
          )"
          RUNNER_PUBLIC_IP="$(printf '%s' "$RUNNER_PUBLIC_IP" | tr -d '\r\n')"

          if [[ ! "$RUNNER_PUBLIC_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Invalid Runner public IP: $RUNNER_PUBLIC_IP"
            exit 1
          fi

          echo "Runner public IP: ${RUNNER_PUBLIC_IP}"
          echo "RUNNER_PUBLIC_IP=${RUNNER_PUBLIC_IP}/32" >> "$GITHUB_ENV"

      - name: Terraform Format and Validate
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -reconfigure -input=false
          terraform validate

      - name: Terraform Plan and Apply
        working-directory: terraform
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan \
            -var="my_ip=156.210.50.116/32" \
            -var="runner_ip=${RUNNER_PUBLIC_IP}"

          terraform apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            tfplan

      - name: Validate Ansible Inventory
        shell: bash
        run: |
          set -euo pipefail

          INVENTORY="ansible/inventory.ini"
          INV_JSON="$RUNNER_TEMP/ansible-inventory.json"

          if [[ ! -s "$INVENTORY" ]]; then
            echo "::error::Ansible inventory is missing or empty."
            exit 1
          fi

          ansible-inventory -i "$INVENTORY" --graph
          ansible-inventory -i "$INVENTORY" --list > "$INV_JSON"

          INV_JSON="$INV_JSON" python3 - <<'PY'
          import json, os

          with open(os.environ["INV_JSON"]) as f:
              inv = json.load(f)

          masters = inv.get("masters", {}).get("hosts", [])
          workers = inv.get("workers", {}).get("hosts", [])

          if len(masters) != 1:
              raise SystemExit(f"Expected 1 master, found {len(masters)}")
          if len(workers) != 1:
              raise SystemExit(f"Expected 1 worker, found {len(workers)}")

          print(f"Master hosts: {masters}")
          print(f"Worker hosts: {workers}")
          PY

      - name: Wait for EC2 Connections
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          ansible k8s_cluster \
            -i ansible/inventory.ini \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=600" \
            --forks 10

      - name: Prepare Kubernetes Nodes
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          ansible-playbook -i ansible/inventory.ini ansible/prepare-k8s.yml --forks 10

      - name: Initialize Kubernetes Control Plane
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          ansible-playbook -i ansible/inventory.ini ansible/cluster.yml --forks 10

      - name: Deploy Kubernetes Cluster
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          ansible-playbook -i ansible/inventory.ini ansible/deploy-cluster.yml --forks 10

      - name: Verify Kubernetes Cluster
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          ansible-playbook -i ansible/inventory.ini ansible/verify-cluster.yml --forks 10

      - name: Final Infrastructure Summary
        if: success()
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Infrastructure Deployment Completed"
            echo ""
            echo "### Terraform Outputs"
            echo '```hcl'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Temporary Artifacts
        if: always()
        shell: bash
        run: |
          rm -f terraform/tfplan
          rm -f "$RUNNER_TEMP/ansible-inventory.json"

          if [[ "${SSH_KEY_CREATED_FROM_SECRET:-false}" == "true" ]]; then
            rm -f "$HOME/.ssh/my-aws-key.pem"
          fi