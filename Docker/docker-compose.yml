
services:
  library-web:
    build:
      context: ..
      dockerfile: Docker/Dockerfile

    container_name: library_app

    ports:
      - "5000:5000"

    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: sqlite:///library.db

    volumes:
      - library_data:/app/instance

    restart: unless-stopped

volumes:
  library_data:
