# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json
---
# ==========================================
# PLAY 1: Initialize Control Plane
# ==========================================
- name: Initialize Kubernetes Control Plane
  hosts: masters
  become: true
  gather_facts: true

  vars:
    pod_network_cidr: "192.168.0.0/16"

  tasks:
    - name: Initialize Kubernetes cluster
      ansible.builtin.command:
        cmd: >
          kubeadm init
          --apiserver-advertise-address={{ ansible_default_ipv4.address }}
          --pod-network-cidr={{ pod_network_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Wait for Kubernetes API Server
      ansible.builtin.command:
        cmd: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: api_status
      until: api_status.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"

