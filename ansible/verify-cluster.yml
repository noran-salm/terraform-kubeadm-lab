
---
- name: Validate Kubernetes Cluster
  hosts: masters
  become: true

  tasks:
    - name: Wait for all Kubernetes nodes to be Ready
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Get Kubernetes nodes
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes_result
      changed_when: false

    - name: Display Kubernetes nodes
      ansible.builtin.debug:
        var: nodes_result.stdout

    - name: Get all Kubernetes pods
      ansible.builtin.command:
        cmd: kubectl get pods -A
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: pods_result
      changed_when: false

    - name: Display Kubernetes pods
      ansible.builtin.debug:
        var: pods_result.stdout
