
---
# PLAY 1: Install Calico on Master
- name: Install Calico CNI
  hosts: masters
  become: true
  gather_facts: true

  tasks:
    - name: Apply Calico v3.33 manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: calico_apply
      changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"

    - name: Wait for Calico DaemonSet
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - daemonset/calico-node
          - -n
          - kube-system
          - --timeout=300s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Generate kubeadm join command
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - create
          - --print-join-command
      register: join_output
      changed_when: false

    - name: Save join command
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_output.stdout }}"


# PLAY 2: Join Worker
- name: Join Worker to Kubernetes Cluster
  hosts: workers
  become: true
  gather_facts: true

  tasks:
    - name: Check if Worker already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_config

    - name: Check API Server connectivity using Controller private IP
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['masters'][0]].ansible_default_ipv4.address }}"
        port: 6443
        state: started
        timeout: 180
        connect_timeout: 5
      when: not kubelet_config.stat.exists

    - name: Join Worker using kubeadm
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['masters'][0]].kubeadm_join_command }}"
      when: not kubelet_config.stat.exists


# PLAY 3: Verify Cluster
- name: Verify Kubernetes Cluster
  hosts: masters
  become: true
  gather_facts: false

  tasks:
    - name: Wait until all nodes are Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=300s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Display cluster nodes
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes_output
      changed_when: false

    - name: Show final nodes
      ansible.builtin.debug:
        var: nodes_output.stdout_lines

    - name: Display all pods
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -A
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: pods_output
      changed_when: false

    - name: Show pod status
      ansible.builtin.debug:
        var: pods_output.stdout_lines
